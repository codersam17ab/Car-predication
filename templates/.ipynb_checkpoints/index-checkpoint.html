<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction</title>
</head>

<body>

    <h2>Predictive analysis</h2>
    <form action="{{ url_for('predict') }}" method="post">
        <div class="body_form">
            <div class="left_side">

                <h3>Year</h3>
                <input id="first" name="Year" type="number" required="required">
                <br><br>
                <h3>What is the Showroom Price?(In lakhs)</h3>
                <input id="second" name="Present_Price" type="number" step="0.01" required="required">
                <br><br>
                <h3>How Many Kilometers Driven?</h3>
                <input id="third" name="Kms_Driven" type="number" required="required">
                <br><br>
                <h3>How many owners previously had the car (0, 1 or 3)?</h3>
                <input id="fourth" name="Owner" type="number" required="required">

            </div>
            <div class="right_side">

                <h3>What is the fuel type?</h3>
                <select name="Fuel_Type" id="dropdown" required="required">
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="CNG">CNG</option>
                </select>
                <p></p>
                <h3>Are you a Dealer or Individual?</h3>
                <select name="Seller_Type" id="dropdown" required="required">
                    <option value="Dealer">Dealer</option>
                    <option value="Individual">Individual</option>
                </select>
                <p></p>
                <h3>Transmission type</h3>
                <select name="Transmission" id="dropdown" required="required">
                    <option value="Manual">Manual Car</option>
                    <option value="Automatic">Automatic Car</option>
                </select>
                <p></p>
                <button id="sub" type="submit">Calculate the Selling Price</button>
                <br>
            </div>

        </div>

    </form>

    <br><br>
    <h3>{{ pred }}</h3>

    <style>
        body {
            text-align: left;
            padding: 16px 32px;
            background-color: #ffffff
        }

        .body_form {
            display: flex;
        }

        .left_side {
            color: black;
            width: 50%;
        }

        .right_side {
            color: black;
            width: 50%;
        }

        h3 {
            font-weight: normal;
        }

        #dropdown {
            width: 240px;
            height: 43px;
            text-align: center;
            border-radius: 12px;
            font-size: 18px;
        }

        #dropdown:hover {
            background-color: coral;
        }

        #sub {
            height: 60px;
            width: 240px;
            margin: 64px 0px;
            padding: 10px 16px;
            text-align: center;
            border-radius: 8px;
            background-color: royalblue;
            color: white;
            font-size: 18px;
        }

        #sub:hover {
            background-color: SlateBlue;
            cursor: pointer;
        }

        #first,
        #second,
        #third,
        #fourth {
            border-radius: 4px;
            height: 40px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</body>

</html>
